[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/contr-hq/contr-linux"
publish = false

[workspace.dependencies]
contr-containers = { path = "crates/contr-containers" }
contr-containers-api = { path = "crates/contr-containers-api" }
contr-daemon-ui = { path = "crates/contr-daemon-ui" }
contr-images = { path = "crates/contr-images" }
contr-ui-common = { path = "crates/contr-ui-common" }

contr-core = { git = "https://github.com/contr-hq/contr", rev = "608f962313ab7638e5d0d5d8d1d7a4182070ae29" }
contr-sdk = { git = "https://github.com/contr-hq/contr", rev = "608f962313ab7638e5d0d5d8d1d7a4182070ae29" }

anyhow = "1.0.104"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
glib-build-tools = "0.22.8"
ksni = "0.3.6"
prost-types = "0.14.4"
relm4 = { version = "0.11.0", default-features = false, features = ["gnome_49", "libadwaita", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = "1.54.0"
tonic = { version = "0.14.6", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
vte4 = { version = "0.10.0", features = ["v0_76"] }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
too_many_lines = "allow"
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
